aid: useorigin
name: Origin Financial
description: Origin (Blend Financial Inc. DBA Origin Financial) is a personal finance
  platform built around an SEC-regulated AI financial advisor, combining spending
  tracking, budgeting, investing, tax filing, estate planning, and couples money
  management in one app, and offering employers a financial wellness benefit. Account
  connections run through partners including Plaid, MX, and Mastercard. Origin is
  a consumer and employer product with no public developer API surface today.
